global:
  scrape_interval:     10s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "user_service"
    metrics_path: /user/metrics
    static_configs:
      - targets: ['user_service_http:8001']
  - job_name: "auth_service"
    metrics_path: /auth/metrics
    static_configs:
      - targets: ['auth_service_http:8002']
  - job_name: "notes_service"
    metrics_path: /note/metrics
    static_configs:
      - targets: ['notes_service_http:8003']